name: Daily Sketch Man meme

on:
  schedule:
    # GitHub starts cron jobs late (sometimes hours) or skips them, so try three times before the
    # 7:00 PM PKT slot: 3:13 PM, 4:43 PM and 6:07 PM PKT. Each run checks data/history.json and
    # does nothing if the next slot already has an episode, so only one video goes out per day.
    - cron: "13 10 * * *"
    - cron: "43 11 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = real episode, public at the next free PUBLISH_TIME slot · publish-now = public immediately · private-upload = real episode uploaded PRIVATE (never goes public by itself) · no-upload = real episode, no YouTube · test = sample script + robot voices, needs no keys · upload-test = sample uploaded PRIVATE (YouTube) and as a DRAFT (Facebook), checks keys · facebook-test = sample: Reel saved as DRAFT, photo uploaded unpublished, no Story"
        type: choice
        options: [full, private-upload, publish-now, no-upload, test, upload-test, facebook-test]
        default: test

permissions:
  contents: write # to commit data/history.json

concurrency:
  group: daily-episode
  cancel-in-progress: false

env:
  # Change these in Settings → Secrets and variables → Actions → Variables.
  UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'schedule' }}
  PUBLISH_TIME: ${{ vars.PUBLISH_TIME || '19:00' }}
  PUBLISH_UTC_OFFSET: ${{ vars.PUBLISH_UTC_OFFSET || '5' }}
  PUBLISH_DELAY_DAYS: ${{ vars.PUBLISH_DELAY_DAYS || '0' }}
  TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'gemini' }}
  SKETCH_VOICE: ${{ vars.SKETCH_VOICE || 'Puck' }}
  BRO_VOICE: ${{ vars.BRO_VOICE || 'Fenrir' }}
  TARGET_WPS: ${{ vars.TARGET_WPS || '2.5' }}
  VOICE_SPEED: ${{ vars.VOICE_SPEED || '1.0' }}
  BEAT_GAP: ${{ vars.BEAT_GAP || '0.6' }}
  MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS || 'false' }}
  # Facebook Reels run whenever FACEBOOK_PAGE_ID and FACEBOOK_PAGE_TOKEN secrets exist. Set FACEBOOK_ENABLED=false to pause.
  FACEBOOK_ENABLED: ${{ vars.FACEBOOK_ENABLED || 'true' }}
  # Each day on the Page: 1 Reel (7 PM), 1 photo (3 h later), 1 Story (when the run finishes). Set any to false to drop it.
  FACEBOOK_REEL: ${{ vars.FACEBOOK_REEL || 'true' }}
  FACEBOOK_PHOTO: ${{ vars.FACEBOOK_PHOTO || 'true' }}
  FACEBOOK_STORY: ${{ vars.FACEBOOK_STORY || 'true' }}
  FACEBOOK_PHOTO_DELAY_HOURS: ${{ vars.FACEBOOK_PHOTO_DELAY_HOURS || '3' }}
  SCRIPT_PROVIDER: ${{ vars.SCRIPT_PROVIDER || 'gemini' }}
  TRENDS: ${{ vars.TRENDS || 'on' }}
  CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE || 'English' }}
  TTS_LANGUAGE: ${{ vars.TTS_LANGUAGE || 'en-US' }}
  VIDEO_LANGUAGE: ${{ vars.VIDEO_LANGUAGE || 'en' }}
  AUDIENCE: ${{ vars.AUDIENCE }}
  WATERMARK: ${{ vars.WATERMARK || '@sketchman' }}
  GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
  ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

jobs:
  episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64
          curl -sSL -o /tmp/rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          unzip -q /tmp/rhubarb.zip -d /opt
          echo "RHUBARB_PATH=/opt/Rhubarb-Lip-Sync-1.13.0-Linux/rhubarb" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Make episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_BRO_VOICE_ID: ${{ secrets.ELEVENLABS_BRO_VOICE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
        run: |
          case "$MODE" in
            test)        npm run episode -- --sample --tts=espeak --no-upload ;;
            no-upload)   npm run episode -- --no-upload ;;
            publish-now) UPLOAD_MODE=public npm run episode ;;
            private-upload) UPLOAD_MODE=private FACEBOOK_DRAFT=true npm run episode ;;
            upload-test) UPLOAD_MODE=private FACEBOOK_DRAFT=true npm run episode -- --sample --tts=espeak ;;
            facebook-test) FACEBOOK_DRAFT=true npm run episode -- --sample --tts=espeak --facebook-only ;;
            full)        npm run episode ;;
            *)           npm run episode -- --if-slot-free ;;
          esac

      # Save history FIRST and always: if this is skipped after an upload, the next daily try thinks
      # the slot is still free and uploads the episode again.
      - name: Save episode history
        if: always()
        run: |
          git config user.name "sketchman-bot"
          git config user.email "sketchman-bot@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Episode $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi

      # Keep this episode's MP4 in the "episodes" GitHub Release, for the weekly compilation.
      # Release files don't use the Actions artifact storage.
      - name: Archive the episode
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/archive.txt ] || { echo "No new episode to archive."; exit 0; }
          src=$(sed -n 1p out/archive.txt); name=$(sed -n 2p out/archive.txt)
          gh release view episodes >/dev/null 2>&1 || gh release create episodes --title "Episode archive" \
            --notes "Every Sketch Man episode, kept for the weekly compilation. Added automatically." --latest=false
          cp "$src" "/tmp/$name" && gh release upload episodes "/tmp/$name" --clobber
          echo "Archived $name"

      # Optional copy of the video for review. Never fails the run: GitHub's artifact storage is
      # shared by all your repos and can fill up.
      - name: Keep the video for 3 days
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: episode-${{ github.run_number }}
          path: |
            out/*/episode.mp4
            out/*/script.json
            out/*/facebook-*.jpg
          retention-days: 1
          if-no-files-found: ignore
