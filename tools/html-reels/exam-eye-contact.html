<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Eye Contact</title>
<style>
/* Layout idea: an editing-suite page — the 9:16 stage on the left, transport + SFX cue sheet on the right (stacked on phones). */
:root {
  --bg: #ECEAE4;
  --panel: #FFFFFF;
  --ink: #17161A;
  --muted: #6B6872;
  --line: #D9D5CC;
  --accent: #E2463C;
  --cue: #F4C542;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141317; --panel: #1E1D23; --ink: #F1EFEA; --muted: #A29FAA; --line: #34323B; --accent: #FF6A5E; --cue: #F4C542;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141317; --panel: #1E1D23; --ink: #F1EFEA; --muted: #A29FAA; --line: #34323B; --accent: #FF6A5E; --cue: #F4C542;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
.app { height: 100%; display: grid; grid-template-columns: auto minmax(280px, 400px); gap: 24px; padding: 16px; justify-content: center; align-items: center; }
.stage-wrap { height: calc(100vh - 32px); aspect-ratio: 9 / 16; max-width: calc((100vh - 32px) * 9 / 16); position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.18); background: #F5F3EC; }
.stage-wrap svg { width: 100%; height: 100%; display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 16px; align-content: start; max-height: calc(100vh - 32px); overflow: auto; }
.panel h1 { font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { font: 600 14px var(--font-ui); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 14px; cursor: pointer; }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.time { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; margin-left: auto; }
.shot { font-size: 13px; color: var(--muted); }
.shot b { color: var(--ink); }
.track { position: relative; height: 44px; border-radius: 8px; background: color-mix(in srgb, var(--line) 55%, transparent); overflow: hidden; }
.track .seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--panel); font-size: 10px; color: var(--muted); padding: 4px 5px; white-space: nowrap; overflow: hidden; }
.track .seg.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--ink); }
.track .mark { position: absolute; bottom: 0; width: 2px; height: 14px; background: var(--cue); }
.track .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.cues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cues li { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: baseline; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; font-size: 13px; line-height: 1.35; }
.cues li .tc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cues li.on { border-color: var(--cue); background: color-mix(in srgb, var(--cue) 16%, transparent); }
.cues li.on .tc { color: var(--ink); }
.label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .stage-wrap { height: auto; width: 100%; max-width: 420px; margin: 0 auto; }
  .panel { max-height: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" aria-label="9:16 animation stage">
    <svg id="stage" viewBox="0 0 1080 1920" role="img" aria-label="POV: making eye contact with bro during a hard exam">
      <defs>
        <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="aura" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
        <radialGradient id="vig" cx="50%" cy="45%" r="70%">
          <stop offset=".6" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".35"/>
        </radialGradient>
      </defs>
      <g id="scene"></g>
    </svg>
  </div>

  <aside class="panel">
    <div>
      <div class="label">Shorts animatic · 9:16 · 14.00 s loop</div>
      <h1>POV: Making eye contact with bro during a hard exam</h1>
      <p class="sub">Hard cuts on a single 14 s clock. Screen-record the stage, then drop sounds on the cues below.</p>
    </div>

    <div class="transport">
      <button id="play" class="primary" type="button" aria-pressed="true">Pause</button>
      <button id="replay" type="button">Replay</button>
      <span class="time" id="time">00.00 / 14.00</span>
    </div>

    <div>
      <label class="label" for="scrub">Scrub</label>
      <input id="scrub" type="range" min="0" max="14" step="0.01" value="0">
    </div>

    <div>
      <div class="label">Shots</div>
      <div class="track" id="track"></div>
      <p class="shot" id="shot"></p>
    </div>

    <div>
      <div class="label">Sound cues</div>
      <ul class="cues" id="cues"></ul>
    </div>
  </aside>
</div>

<script>
(() => {
  const DUR = 14;
  const INK = "#111111";
  const SW = 6; // outline weight in canvas px

  const SHOTS = [
    { a: 0.0, b: 2.5, name: "1 · Setup", desc: "Medium close-up: YOU sweating over the math final." },
    { a: 2.5, b: 4.5, name: "2 · The turn", desc: "Eyes slide right, then the head snaps toward BRO." },
    { a: 4.5, b: 8.0, name: "3 · Reveal", desc: "Hard cut + 1.25x punch-in: BRO's eyebrows, wink, stickman drawing." },
    { a: 8.0, b: 11.0, name: "4 · Suppressed laugh", desc: "Extreme close-up: puffed cheeks, blush, lip bite, shaking." },
    { a: 11.0, b: 12.8, name: "5 · The break", desc: "Wide two-shot: both lose it. HAHAHA." },
    { a: 12.8, b: 14.0, name: "6 · Twist", desc: "Dark tint + shake: the teacher is right behind them. Freeze, loop." },
  ];

  const CUES = [
    { a: 0.0, b: 2.5, text: "[SFX: Pencil scratching + wall clock ticking] (quiet exam room tone under it)" },
    { a: 2.5, b: 3.6, text: "[SFX: Slow suspicious eye-slide \"hmmm\" / tension string]" },
    { a: 3.85, b: 4.2, text: "[SFX: Head-snap whoosh]" },
    { a: 4.5, b: 4.9, text: "[SFX: Vine Boom] on the punch-in" },
    { a: 5.0, b: 6.0, text: "[SFX: Eyebrow \"boing\" x2] at 5.0 s and 5.6 s" },
    { a: 6.2, b: 6.7, text: "[SFX: Wink \"ding\" / sparkle]" },
    { a: 6.7, b: 8.0, text: "[SFX: Paper rustle + goofy kazoo sting]" },
    { a: 8.0, b: 11.0, text: "[SFX: Record scratch at 8.0, then rising muffled wheeze / snort]" },
    { a: 11.0, b: 12.8, text: "[SFX: Explosive laughter \"HAHAHA\" + laugh track]" },
    { a: 12.8, b: 14.0, text: "[SFX: Hard music cut, bass drop + Teacher Boss Music]" },
  ];

  /* ---------- helpers ---------- */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eo = (x) => 1 - Math.pow(1 - x, 3);           // ease-out cubic
  const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const bump = (t, a, b) => Math.sin(Math.PI * seg(t, a, b)); // 0→1→0
  const f = (n) => n.toFixed(1);

  /* ---------- background ---------- */
  function classroom(dark = 0) {
    return `
      <rect width="1080" height="1920" fill="#F5F3EC"/>
      <rect x="0" y="1450" width="1080" height="470" fill="#ECE7DB"/>
      <line x1="0" y1="1450" x2="1080" y2="1450" stroke="#D8D2C5" stroke-width="8"/>
      <rect x="90" y="330" width="760" height="380" rx="12" fill="#2B473E" stroke="#6E4E37" stroke-width="18"/>
      <text x="130" y="415" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="40" fill="#E8ECEA" opacity=".85">MATH FINAL - NO TALKING!</text>
      <text x="130" y="495" font-family="Archivo, Arial, sans-serif" font-size="34" fill="#E8ECEA" opacity=".7">1) Find x</text>
      <text x="130" y="555" font-family="Archivo, Arial, sans-serif" font-size="34" fill="#E8ECEA" opacity=".7">2) ∫ e^(πx) dx = ??</text>
      <text x="130" y="615" font-family="Archivo, Arial, sans-serif" font-size="34" fill="#E8ECEA" opacity=".7">3) Good luck...</text>
      <g transform="translate(955 430)">
        <circle r="62" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}"/>
        <line x1="0" y1="0" x2="0" y2="-40" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="28" y2="12" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
      </g>`;
  }

  function desk(x, y, w) {
    return `<rect x="${x - w / 2}" y="${y}" width="${w}" height="44" rx="8" fill="#B07442" stroke="${INK}" stroke-width="${SW}"/>
      <rect x="${x - w / 2 + 30}" y="${y + 44}" width="22" height="300" fill="#8E5C34" stroke="${INK}" stroke-width="${SW}"/>
      <rect x="${x + w / 2 - 52}" y="${y + 44}" width="22" height="300" fill="#8E5C34" stroke="${INK}" stroke-width="${SW}"/>`;
  }

  function examPaper(x, y, blank = false) {
    const lines = blank ? "" : `
      <text x="${x - 110}" y="${y - 8}" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="20" fill="${INK}">MATH FINAL: 1 + 1 = ??</text>
      <text x="${x - 100}" y="${y + 22}" font-family="Archivo, Arial, sans-serif" font-size="18" fill="#555">∑∂ ≈ ¿π? ⊗ √!! ∫∫ ∞÷0</text>`;
    return `<polygon points="${x - 140},${y + 40} ${x + 140},${y + 40} ${x + 120},${y - 40} ${x - 120},${y - 40}" fill="#FFFFFF" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>${lines}`;
  }

  /* ---------- YOU ---------- */
  // Head centred at (0,0), r = 130. o: look (-1..1 pupils), turn (0..1), mood, blush, puff, sweat
  function youHead(o) {
    const fx = (o.turn || 0) * 40;
    const rx = 130 * (1 + (o.puff || 0) * 0.16);
    let s = `<ellipse cx="0" cy="0" rx="${f(rx)}" ry="130" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW + 2}"/>
      <path d="M -60 -118 L -25 -160 L -5 -124 L 30 -166 L 45 -120" fill="none" stroke="${INK}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`;
    const ey = -12;
    for (const side of [-1, 1]) {
      const ex = side * 48 + fx;
      if (o.mood === "nervous") {
        const px = ex + clamp(o.look || 0, -1, 1) * 13;
        s += `<ellipse cx="${f(ex)}" cy="${ey}" rx="28" ry="34" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}"/>
          <circle cx="${f(px)}" cy="${ey + 2}" r="10" fill="${INK}"/>
          <path d="M ${f(ex - side * 26)} ${ey - 56} Q ${f(ex)} ${ey - 70} ${f(ex + side * 26)} ${ey - 48}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
      } else if (o.mood === "puff") {
        s += `<path d="M ${f(ex - side * 22)} ${ey - 14} L ${f(ex + side * 16)} ${ey} L ${f(ex - side * 22)} ${ey + 14}" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M ${f(ex - side * 30)} ${ey - 36} L ${f(ex + side * 22)} ${ey - 50}" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`;
      } else if (o.mood === "laugh") {
        s += `<path d="M ${f(ex - 26)} ${ey + 8} Q ${f(ex)} ${ey - 24} ${f(ex + 26)} ${ey + 8}" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>
          <path d="M ${f(ex - 24)} ${ey - 48} Q ${f(ex)} ${ey - 64} ${f(ex + 24)} ${ey - 48}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
          <path d="M ${f(ex + side * 34)} ${ey + 14} q ${side * 18} 24 ${side * 6} 44" fill="none" stroke="#63B3ED" stroke-width="10" stroke-linecap="round"/>`;
      }
    }
    if (o.blush) {
      s += `<ellipse cx="${f(-82 + fx)}" cy="42" rx="34" ry="18" fill="#F28B8B" opacity="${f(o.blush * 0.85)}"/>
        <ellipse cx="${f(82 + fx)}" cy="42" rx="34" ry="18" fill="#F28B8B" opacity="${f(o.blush * 0.85)}"/>`;
    }
    if (o.mood === "nervous") {
      s += `<path d="M ${f(-38 + fx)} 70 Q ${f(-18 + fx)} 58 ${f(fx)} 70 Q ${f(18 + fx)} 82 ${f(38 + fx)} 70" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`;
    } else if (o.mood === "puff") {
      // lips pressed, teeth biting the lower lip, cheek puff lines
      s += `<path d="M -34 76 Q 0 86 34 76" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>
        <rect x="-16" y="62" width="32" height="14" rx="3" fill="#FFFFFF" stroke="${INK}" stroke-width="4"/>
        <path d="M ${f(-rx + 22)} 10 q -12 30 4 58 M ${f(rx - 22)} 10 q 12 30 -4 58" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" opacity=".6"/>`;
    } else if (o.mood === "laugh") {
      s += `<path d="M -66 36 Q 0 46 66 30 Q 60 150 0 156 Q -60 150 -66 36 Z" fill="${INK}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
        <path d="M -58 40 Q 0 50 58 34 L 56 54 Q 0 66 -56 58 Z" fill="#FFFFFF"/>
        <ellipse cx="0" cy="126" rx="32" ry="18" fill="#E05A5A"/>`;
    }
    if (o.sweat) {
      const dy = ((o.t || 0) * 60) % 50;
      s += `<path d="M -112 ${f(-58 + dy)} Q -128 ${f(-18 + dy)} -112 ${f(-2 + dy)} Q -96 ${f(-18 + dy)} -112 ${f(-58 + dy)} Z" fill="#63B3ED" stroke="${INK}" stroke-width="5" opacity="${f(o.sweat)}"/>`;
    }
    return s;
  }

  function youBody(breath = 0) {
    return `<g transform="translate(0 0) scale(1 ${f(1 + breath * 0.012)})">
      <path d="M -120 445 L -95 150 Q 0 112 95 150 L 120 445 Z" fill="#4A5568" stroke="${INK}" stroke-width="${SW + 2}" stroke-linejoin="round"/>
      <path d="M -72 150 Q 0 206 72 150" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
      <line x1="-24" y1="172" x2="-24" y2="262" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
      <line x1="24" y1="172" x2="24" y2="262" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    </g>`;
  }

  function youHands(t, tremble = 1) {
    const r = Math.sin(t * 44) * 3 * tremble;
    const scratch = Math.sin(t * 22) * 8 * tremble;
    return `<circle cx="-78" cy="372" r="26" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}"/>
      <g transform="rotate(${f(r)} 88 372) translate(${f(scratch)} 0)">
        <line x1="88" y1="372" x2="132" y2="306" stroke="#ECC94B" stroke-width="13" stroke-linecap="round"/>
        <line x1="88" y1="372" x2="132" y2="306" stroke="${INK}" stroke-width="3" stroke-linecap="round" opacity=".35"/>
        <circle cx="88" cy="372" r="26" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}"/>
      </g>`;
  }

  /* ---------- BRO ---------- */
  // Head centred at (0,0), r = 110. o: raise (0..1), wink, grin (0 smug, 1 massive), laugh
  function broHead(o) {
    const raise = (o.raise || 0) * 20;
    let s = `<circle cx="0" cy="0" r="110" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW + 2}"/>
      <path d="M -108 -26 Q -104 -128 0 -134 Q 104 -128 108 -26 Q 0 -46 -108 -26 Z" fill="#E63946" stroke="${INK}" stroke-width="${SW + 1}" stroke-linejoin="round"/>
      <path d="M 98 -38 L 176 -26 Q 170 -2 98 -10 Z" fill="#C1121F" stroke="${INK}" stroke-width="${SW + 1}" stroke-linejoin="round"/>
      <circle cx="0" cy="-130" r="9" fill="#C1121F" stroke="${INK}" stroke-width="5"/>`;
    if (o.laugh) {
      s += `<path d="M -58 4 Q -36 -22 -14 4 M 14 4 Q 36 -22 58 4" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>
        <path d="M -60 30 Q 0 40 60 26 Q 54 132 0 136 Q -54 132 -60 30 Z" fill="${INK}"/>
        <path d="M -52 34 Q 0 44 52 30 L 50 48 Q 0 58 -50 52 Z" fill="#FFFFFF"/>
        <ellipse cx="0" cy="110" rx="28" ry="15" fill="#E05A5A"/>
        <path d="M -66 14 q -18 22 -6 40 M 66 14 q 18 22 6 40" fill="none" stroke="#63B3ED" stroke-width="9" stroke-linecap="round"/>`;
      return s;
    }
    s += `<circle cx="-34" cy="-2" r="14" fill="${INK}"/>`;
    s += o.wink
      ? `<path d="M 16 0 Q 34 -16 52 0" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`
      : `<circle cx="34" cy="-2" r="14" fill="${INK}"/>`;
    s += `<path d="M -54 ${f(-38 - raise)} Q -34 ${f(-54 - raise)} -14 ${f(-36 - raise)}" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>
      <path d="M 14 ${f(-34 - raise)} Q 34 ${f(-52 - raise)} 54 ${f(-38 - raise)}" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`;
    const g = o.grin || 0;
    if (g < 0.5) {
      s += `<path d="M -34 40 Q 0 64 40 32" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`;
    } else {
      s += `<path d="M -66 26 Q 0 40 70 18 Q 56 104 0 108 Q -56 104 -66 26 Z" fill="${INK}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
        <path d="M -60 30 Q 0 44 64 22 L 60 44 Q 0 62 -58 50 Z" fill="#FFFFFF"/>`;
    }
    return s;
  }

  function broBody() {
    return `<path d="M -74 330 L -60 140 Q 0 118 60 140 L 74 330 Z" fill="#D9534F" stroke="${INK}" stroke-width="${SW + 2}" stroke-linejoin="round"/>
      <path d="M -30 138 Q 0 168 30 138" fill="none" stroke="${INK}" stroke-width="6"/>`;
  }

  // The "answer sheet": a badly drawn stickman
  function stickmanPaper() {
    return `<g>
      <rect x="-110" y="-140" width="220" height="280" rx="6" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}" transform="rotate(-5)"/>
      <g transform="rotate(-5)" fill="none" stroke="#2F5DA8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="-6" cy="-62" r="34"/>
        <circle cx="-18" cy="-68" r="4" fill="#2F5DA8"/><circle cx="8" cy="-64" r="4" fill="#2F5DA8"/>
        <path d="M -22 -46 Q -4 -34 14 -50"/>
        <path d="M -4 -28 L 4 52 M -54 -2 L 2 4 L 58 -16 M 4 52 L -36 104 M 4 52 L 44 108"/>
        <path d="M 52 -100 l 10 -16 l 6 18 l 14 -8" stroke="#E63946"/>
      </g>
    </g>`;
  }

  /* ---------- TEACHER ---------- */
  function teacher(eyesOnly = false) {
    const eyes = `<g filter="url(#glow)">
        <circle cx="-60" cy="-8" r="13" fill="#FF2A2A"/>
        <circle cx="60" cy="-8" r="13" fill="#FF2A2A"/>
      </g>`;
    if (eyesOnly) return eyes;
    return `<ellipse cx="0" cy="260" rx="330" ry="560" fill="#1A0612" opacity=".85" filter="url(#aura)"/>
      <path d="M -210 760 L -170 230 Q 0 180 170 230 L 210 760 Z" fill="#2D2A32" stroke="${INK}" stroke-width="${SW + 2}" stroke-linejoin="round"/>
      <path d="M -60 220 L 0 330 L 60 220" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
      <path d="M -14 236 L 14 236 L 22 400 L 0 430 L -22 400 Z" fill="#8E1B1B" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <ellipse cx="0" cy="0" rx="130" ry="150" fill="#E9E7E2" stroke="${INK}" stroke-width="${SW + 2}"/>
      <path d="M -120 -60 Q -80 -170 0 -156 Q 80 -170 120 -60 Q 100 -120 0 -118 Q -100 -120 -120 -60 Z" fill="#3A3A40" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
      <rect x="-104" y="-34" width="88" height="54" rx="6" fill="#111" stroke="${INK}" stroke-width="7"/>
      <rect x="16" y="-34" width="88" height="54" rx="6" fill="#111" stroke="${INK}" stroke-width="7"/>
      <line x1="-16" y1="-10" x2="16" y2="-10" stroke="${INK}" stroke-width="7"/>
      <path d="M -100 -58 L -24 -40 M 100 -58 L 24 -40" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>
      <line x1="-44" y1="80" x2="44" y2="80" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
      ${eyes}`;
  }

  /* ---------- top hook text ---------- */
  function hook(t) {
    if (t > 3.25) return "";
    const op = t < 3 ? 1 : 1 - seg(t, 3, 3.25);
    const sc = 0.9 + 0.1 * eo(seg(t, 0, 0.18));
    return `<g opacity="${f(op)}" transform="translate(540 168) scale(${sc.toFixed(3)})">
      <rect x="-450" y="-88" width="900" height="176" rx="22" fill="#FFFFFF" stroke="${INK}" stroke-width="8"/>
      <text x="0" y="-14" text-anchor="middle" font-family="Archivo Black, Arial Black, Impact, sans-serif" font-weight="900" font-size="50" fill="${INK}">POV: Making eye contact with bro</text>
      <text x="0" y="50" text-anchor="middle" font-family="Archivo Black, Arial Black, Impact, sans-serif" font-weight="900" font-size="50" fill="${INK}">during a hard exam 😭</text>
    </g>`;
  }

  /* ---------- shots ---------- */
  function shotSetup(t) {
    // 0–4.5 s: medium close-up on YOU; eyes slide at 2.5–3.6, head snaps at 3.85
    const look = eio(seg(t, 2.5, 3.6));
    const snap = eo(seg(t, 3.85, 3.97));
    const breath = Math.sin((t / 1.6) * Math.PI * 2);
    const hx = 540 + snap * 26, hy = 880;
    const tilt = snap * 7 - bump(t, 3.85, 4.15) * 3;
    let lines = "";
    if (t > 3.85 && t < 4.25) {
      const o = 1 - seg(t, 3.85, 4.25);
      lines = `<g stroke="${INK}" stroke-width="7" stroke-linecap="round" opacity="${f(o)}">
        <line x1="290" y1="760" x2="330" y2="770"/><line x1="270" y1="860" x2="320" y2="862"/><line x1="290" y1="960" x2="330" y2="950"/></g>`;
    }
    return `<g transform="translate(540 1000) scale(1.12) translate(-540 -1000)">${classroom()}</g>
      <g transform="translate(${hx - 26 * snap} ${hy}) scale(1.3)">
        ${youBody(breath)}
        ${desk(0, 386, 520)}
        ${examPaper(0, 352)}
        ${youHands(t, t < 2.5 ? 1 : 0.4)}
        <g transform="translate(${f(snap * 20)} 0) rotate(${f(tilt)} 0 120)">
          ${youHead({ mood: "nervous", look: look, turn: snap, sweat: 1, t })}
        </g>
      </g>
      ${lines}`;
  }

  function shotReveal(t) {
    // 4.5–8.0 s: hard cut, punch-in to 1.25x; brows x2, wink + big grin, stickman paper
    const z = 1 + 0.25 * eo(seg(t, 4.5, 4.64));
    const raise = Math.max(bump(t, 5.0, 5.4), bump(t, 5.6, 6.0));
    const wink = t >= 6.2 && t < 6.75;
    const grin = t >= 6.2 ? 1 : 0;
    const p = back(seg(t, 6.7, 7.05));
    const paperY = 1500 - p * 560;
    return `<g transform="translate(540 900) scale(${z.toFixed(3)}) translate(-540 -900)">
        <g transform="translate(560 1000) scale(1.05) translate(-560 -1000)">${classroom()}</g>
        <g transform="translate(540 820) scale(1.4)">
          ${broBody()}
          ${desk(0, 300, 470)}
          ${examPaper(0, 268, true)}
          <g transform="rotate(${f(Math.sin(t * 3) * 2)} 0 100)">${broHead({ raise, wink, grin })}</g>
        </g>
        ${t >= 6.7 ? `<g transform="translate(830 ${f(paperY)}) rotate(${f(8 - p * 8)})">${stickmanPaper()}</g>
          <circle cx="${f(760)}" cy="${f(paperY + 120)}" r="34" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW + 2}"/>` : ""}
        ${wink ? `<g stroke="#F4C542" stroke-width="8" stroke-linecap="round" opacity="${f(1 - seg(t, 6.2, 6.75))}"><line x1="700" y1="700" x2="740" y2="660"/><line x1="720" y1="720" x2="780" y2="712"/><line x1="690" y1="676" x2="700" y2="630"/></g>` : ""}
      </g>`;
  }

  function shotHoldIn(t) {
    // 8–11 s: extreme close-up; cheeks puff, blush rises, vibration builds
    const puff = eo(seg(t, 8.0, 8.35));
    const blush = eio(seg(t, 8.25, 10.2));
    const a = 3 + 16 * seg(t, 8.0, 11.0);
    const dx = a * Math.sin(t * 97), dy = a * 0.7 * Math.cos(t * 83);
    const scratch = t < 8.25 ? `<text x="540" y="380" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="64" fill="${INK}" opacity="${f(1 - seg(t, 8.0, 8.25))}">*SNRK*</text>` : "";
    return `<g transform="translate(${f(dx)} ${f(dy)})">
        <g transform="translate(540 1100) scale(1.5) translate(-540 -1100)">${classroom()}</g>
        <g transform="translate(540 980) scale(2.65)">
          ${youBody(0)}
          ${youHead({ mood: "puff", puff, blush, sweat: 1, t })}
        </g>
      </g>${scratch}`;
  }

  function wideStudents(t, frozen) {
    // YOU left, BRO right, both heads thrown back laughing
    const tt = frozen ? 12.6 : t;
    const bob = Math.sin(tt * 18);
    const tiltY = -16 + bob * 4, tiltB = 16 - bob * 4;
    return `
      <g transform="translate(310 960) scale(0.95)">
        ${youBody(0)}
        ${desk(0, 386, 470)}
        ${examPaper(0, 352)}
        <circle cx="-78" cy="372" r="26" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}"/>
        <circle cx="88" cy="372" r="26" fill="#FFFFFF" stroke="${INK}" stroke-width="${SW}"/>
        <g transform="translate(0 ${f(-Math.abs(bob) * 10)}) rotate(${f(tiltY)} 0 120)">${youHead({ mood: "laugh", t: tt })}</g>
      </g>
      <g transform="translate(790 950) scale(0.92)">
        ${broBody()}
        ${desk(0, 300, 420)}
        ${examPaper(0, 268, true)}
        <g transform="translate(0 ${f(-Math.abs(bob) * 10)}) rotate(${f(tiltB)} 0 100)">${broHead({ laugh: true })}</g>
      </g>`;
  }

  function hahaha(t) {
    const pops = [
      { at: 11.0, x: 250, y: 560, r: -10, s: 1.0 },
      { at: 11.25, x: 800, y: 520, r: 9, s: 0.9 },
      { at: 11.55, x: 530, y: 410, r: -3, s: 1.2 },
    ];
    return pops.map((p) => {
      if (t < p.at) return "";
      const k = back(seg(t, p.at, p.at + 0.2)) * p.s;
      return `<text x="${p.x}" y="${p.y}" text-anchor="middle" transform="rotate(${p.r} ${p.x} ${p.y}) translate(${p.x} ${p.y}) scale(${k.toFixed(3)}) translate(${-p.x} ${-p.y})"
        font-family="Archivo Black, Arial Black, Impact, sans-serif" font-weight="900" font-size="96" fill="#FFD84D" stroke="${INK}" stroke-width="10" paint-order="stroke" stroke-linejoin="round">HAHAHA</text>`;
    }).join("");
  }

  function shotBreak(t) {
    return `<g transform="translate(540 1000) scale(0.98) translate(-540 -1000)">${classroom()}</g>${wideStudents(t, false)}${hahaha(t)}`;
  }

  function shotTwist(t) {
    const k = seg(t, 12.8, 13.25);
    const sh = 4 * (1 - k * 0.6);
    const dx = sh * Math.sin(t * 130), dy = sh * Math.cos(t * 111);
    return `<g transform="translate(${f(dx)} ${f(dy)})">
        <g transform="translate(540 1000) scale(0.98) translate(-540 -1000)">${classroom()}</g>
        <g transform="translate(540 560) scale(1.18)">${teacher()}</g>
        ${wideStudents(t, true)}
        <rect width="1080" height="1920" fill="#14001E" opacity=".58"/>
        <rect width="1080" height="1920" fill="url(#vig)"/>
        <g transform="translate(540 560) scale(1.18)">${teacher(true)}</g>
      </g>`;
  }

  function scene(t) {
    let body;
    if (t < 4.5) body = shotSetup(t);
    else if (t < 8.0) body = shotReveal(t);
    else if (t < 11.0) body = shotHoldIn(t);
    else if (t < 12.8) body = shotBreak(t);
    else body = shotTwist(t);
    return body + hook(t);
  }

  /* ---------- transport + cue sheet ---------- */
  const $ = (id) => document.getElementById(id);
  const sceneEl = $("scene"), playBtn = $("play"), scrub = $("scrub"), timeEl = $("time"), shotEl = $("shot");
  const track = $("track"), cueList = $("cues");

  track.innerHTML = SHOTS.map((s, i) => `<div class="seg" data-i="${i}" style="left:${(s.a / DUR) * 100}%;width:${((s.b - s.a) / DUR) * 100}%">${s.name}</div>`).join("")
    + CUES.map((c) => `<div class="mark" style="left:${(c.a / DUR) * 100}%"></div>`).join("")
    + `<div class="head" id="head"></div>`;
  cueList.innerHTML = CUES.map((c, i) => `<li data-i="${i}"><span class="tc">${c.a.toFixed(2)}s</span><span>${c.text}</span></li>`).join("");
  const segs = [...track.querySelectorAll(".seg")], cueEls = [...cueList.children], headEl = $("head");

  let t = 0, playing = true, last = performance.now(), lastUiShot = -1;

  function draw() {
    sceneEl.innerHTML = scene(t);
    timeEl.textContent = `${t.toFixed(2).padStart(5, "0")} / ${DUR.toFixed(2)}`;
    scrub.value = t.toFixed(2);
    headEl.style.left = `${(t / DUR) * 100}%`;
    const si = SHOTS.findIndex((s) => t >= s.a && t < s.b);
    if (si !== lastUiShot) {
      segs.forEach((el, i) => el.classList.toggle("on", i === si));
      const s = SHOTS[Math.max(0, si)];
      shotEl.innerHTML = `<b>${s.name}</b> · ${s.a.toFixed(1)}–${s.b.toFixed(1)} s · ${s.desc}`;
      lastUiShot = si;
    }
    cueEls.forEach((el, i) => el.classList.toggle("on", t >= CUES[i].a && t < CUES[i].b));
  }

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      t += dt;
      if (t >= DUR) t = 0; // hard loop: freeze-frame at 14.0 jumps straight back to 0.0
      draw();
    }
    requestAnimationFrame(tick);
  }

  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", String(p));
    last = performance.now();
  }
  playBtn.addEventListener("click", () => setPlaying(!playing));
  $("replay").addEventListener("click", () => { t = 0; draw(); setPlaying(true); });
  scrub.addEventListener("input", () => { t = Math.min(DUR - 0.001, parseFloat(scrub.value)); draw(); });
  scrub.addEventListener("pointerdown", () => setPlaying(false));
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
  });

  window.__seek = (v) => { playing = false; t = v; draw(); };
  draw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
